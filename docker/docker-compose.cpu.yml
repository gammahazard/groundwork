# Groundwork — CPU-only stack, for a machine with no NVIDIA GPU: collect,
# label, curate and manage projects and accounts. Torch installs from the cpu
# wheel channel, so the image is a fraction of the GPU one's size.
#
# The trainer service IS here: CPU training is slow but real, and the app
# spools jobs unconditionally — a stack with no claimant would turn every
# Train click into silence, which is worse than slow.
# Train by pairing a GPU worker machine, or run docker-compose.yml on a GPU
# box — the data layout is identical, so switching files later is the whole
# migration.

name: groundwork

x-base: &base
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      TORCH_CHANNEL: cpu
  image: groundwork:cpu                  # its own tag, so it never shadows a GPU build
  # Starts as root only long enough for the entrypoint to chown /data to
  # GW_UID:GW_GID and drop privileges (gosu) — see the GPU compose file.
  environment:
    - GW_UID=${GW_UID:-1000}
    - GW_GID=${GW_GID:-1000}
    - GW_TRAINER=spool
  volumes:
    - ./data:/data                       # same host directory as the GPU stack
    - gw-venvs:/data/venvs
  restart: unless-stopped

services:
  app:
    <<: *base
    ports:
      - "${GW_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  trainer:
    <<: *base
    command: ["python", "-m", "groundwork.ops.trainerd"]
    # CPU training is slow but real (small models, small epochs) — and the app
    # spools jobs unconditionally, so a stack without a claimant would turn
    # every Train click into silence.
    shm_size: "2gb"

  scheduler:
    <<: *base
    command: ["python", "-m", "groundwork.ops.scheduler"]

volumes:
  gw-venvs:
