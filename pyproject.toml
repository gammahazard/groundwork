# Groundwork packaging. The base install is deliberately TORCH-FREE: the web
# tier, CI and a label-only box must not drag in a multi-GB GPU stack. Torch
# arrives via the [train] extra — and install ORDER is load-bearing there:
# scripts/install.sh and docker/Dockerfile put torch/torchvision in FIRST, from
# the right CUDA channel index, so the unpinned "torch" below is already
# satisfied and nothing later can swap in a generic build.

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwork"
version = "0.4.1"
description = "Self-hosted vision-model trainer: collect, label, train, evaluate, serve"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    # Proven pins carried from the working install — loosen one only with a
    # reason and a test, not because a newer version exists.
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "python-multipart",
    "httpx",              # machine-to-machine calls; its absence once 500'd three endpoints
    "pillow==12.3.0",
    # HEIC/HEIF decoding for PIL — iPhones send it when a photo goes as a FILE,
    # and uploads store it verbatim, so a .heic image reaches the pipeline too.
    # Registered once in groundwork/__init__ (guarded).
    "pillow-heif==1.5.0",
    "numpy==2.5.1",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
# Training. torch/torchvision are UNPINNED here on purpose: which build you
# need (cu128 / cu126 / cpu) is a per-machine choice the installers make by
# installing them first from the matching wheel index — a +cuXXX pin here
# would fight that. ultralytics is likewise unpinned; with torch already
# present it cannot pull a different one in.
train = [
    "torch",
    "torchvision",
    "ultralytics",
    "pyyaml",
    "matplotlib",
    "pandas",
    "tqdm",
    "psutil",
    "scipy",
]

# D-FINE, the built-in challenger. It is the one alternative architecture that
# trains in the MAIN venv rather than its own stack — but it loads through
# transformers, which nothing in [train] installs, so it failed at
# `from transformers import DFineForObjectDetection` on every stock install.
# Measured on a real worker: with this installed, a 4-epoch run trains in 74s.
# The pin tracks [la]'s transformers exactly — one venv, one transformers —
# and DFineForObjectDetection imports clean on 4.57.1 (measured 2026-08-07).
dfine = [
    "transformers==4.57.1",
]

# Telegram capture bots.
bots = [
    "python-telegram-bot==22.8",
]

# The auto-labeler (LocateAnything-3B). Installed by the setup wizard's opt-in
# extras step, after license consent — not by default. Pins matter here: the
# model loads through trust_remote_code, so its vendored code decides what the
# library must look like. This block once pinned transformers 5.14.1 for a
# security floor (advisories in model-loading paths fixed from 5.5 up), with a
# note that the integration "wants a functional revalidation against 5.x".
# That revalidation happened 2026-08-07 and FAILED: the vendored modeling file
# overrides _check_and_adjust_attn_implementation() with a pre-5.x signature
# and dies on `allow_all_kernels` at load. The pin returns to the last combo
# measured working end to end (97 points on a real image, 92s on an 8 GB
# card). The trade is explicit: the 5.x loading-path fixes are forgone on a
# path the user already consents to running vendored code through
# (trust_remote_code), until LA ships 5.x-compatible code.
la = [
    "transformers==4.57.1",
    "bitsandbytes==0.49.2",
    "accelerate==1.14.0",
    "peft==0.19.1",
    "opencv-python-headless==5.0.0.93",
    "decord==0.6.0",
    "lmdb==2.3.0",
]

[project.scripts]
groundwork = "groundwork.cli:main"

[tool.setuptools.packages.find]
include = ["groundwork*", "altmodels*"]
