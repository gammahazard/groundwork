name: release
# Publishes versioned Docker images to ghcr.io on every version tag.
#
# WHILE THE REPO IS PRIVATE THE JOB SKIPS ITSELF: private ghcr storage is
# quota'd far below a CUDA torch image, so publishing would only ever fail.
# The first tag pushed AFTER the repo goes public publishes for real — no
# setting to remember, the condition reads the repo's own visibility.
on:
  push:
    tags: ["v*"]
  # Manual trigger, for the one case the tag-push path cannot serve: publishing
  # an image for a version whose tag was pushed WHILE THE REPO WAS PRIVATE (the
  # job skipped then, and a re-run replays that same private event). Dispatch it
  # with the version and it builds from the current default branch.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the image (e.g. 0.4.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    # Tag pushes keep the private-repo guard; a manual dispatch is always
    # deliberate, so it runs regardless.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - channel: cu128          # default CUDA build — matches the compose default
            suffix: ""
          - channel: cpu            # label-and-manage-only boxes; no CUDA wheels
            suffix: "-cpu"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            TORCH_CHANNEL=${{ matrix.channel }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.v }}${{ matrix.suffix }}
            ghcr.io/${{ github.repository }}:latest${{ matrix.suffix }}
