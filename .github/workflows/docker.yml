name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]

# The workflow needs nothing beyond reading the checkout —
# a compromised step must not be able to push, tag or comment.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Build-only: proves the Dockerfile assembles. The CPU channel keeps the
      # job inside runner disk limits; GPU images are built by users.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            TORCH_CHANNEL=cpu
