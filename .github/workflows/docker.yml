name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build-only: proves the Dockerfile assembles. The CPU channel keeps the
      # job inside runner disk limits; GPU images are built by users.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            TORCH_CHANNEL=cpu
