name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]

# The workflow needs nothing beyond reading the checkout —
# a compromised step must not be able to push, tag or comment.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # Build-only: proves the Dockerfile assembles. The CPU channel keeps the
      # job inside runner disk limits; GPU images are built by users.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            TORCH_CHANNEL=cpu
