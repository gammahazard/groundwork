name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]

# The workflow needs nothing beyond reading the checkout —
# a compromised step must not be able to push, tag or comment.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # Build-only: proves the Dockerfile assembles. The CPU channel keeps the
      # job inside runner disk limits; GPU images are built by users.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            TORCH_CHANNEL=cpu
